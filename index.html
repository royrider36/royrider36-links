<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#09090b">
  <meta name="description" content="Follow ROY RIDER — motorcycle adventures, biker lifestyle, speed, freedom and open roads.">
  <title>ROY RIDER | Life on Two Wheels</title>
  <style>
    :root{color-scheme:dark;--bg:#09090b;--panel:#151518;--red:#ed1c2e;--silver:#d5d7dc;--muted:#a5a6ad}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#351014 0%,#111114 35%,var(--bg) 72%);color:#fff;font-family:Arial,Helvetica,sans-serif;display:flex;justify-content:center;padding:28px 16px}
    main{width:100%;max-width:480px;text-align:center}
    .logo-wrap{width:min(72vw,260px);margin:0 auto 10px;filter:drop-shadow(0 8px 25px #ed1c2e25)}
    .logo-wrap img{display:block;width:100%;height:auto;border-radius:18px}
    .eyebrow{font-size:11px;letter-spacing:.28em;color:var(--silver);font-weight:700;margin:14px 0 8px}
    h1{font-size:clamp(30px,8vw,43px);letter-spacing:.08em;margin:0;font-weight:900}
    .tagline{color:var(--muted);font-size:13px;letter-spacing:.17em;margin:12px 0 25px}
    .rule{height:2px;width:72px;margin:0 auto 24px;background:linear-gradient(90deg,transparent,var(--red),transparent)}
    .links{display:grid;gap:12px}
    .link{display:flex;align-items:center;gap:14px;text-decoration:none;color:white;background:linear-gradient(110deg,#1b1b20,#111114);border:1px solid #39393f;border-radius:14px;padding:16px 18px;transition:transform .18s,border-color .18s}
    .link:hover,.link:focus-visible{transform:translateY(-2px);border-color:var(--red);outline:none}
    .icon{width:42px;height:42px;flex:0 0 42px;display:grid;place-items:center;border-radius:11px;background:#ed1c2e18;color:var(--red)}
    .icon svg{width:23px;height:23px;fill:currentColor}
    .link-text{text-align:left;flex:1}
    .link-text strong{display:block;font-size:15px;letter-spacing:.03em}
    .link-text span{display:block;color:var(--muted);font-size:12px;margin-top:4px}
    .arrow{font-size:23px;color:var(--silver)}
    .footer{margin:26px 0 6px;color:#777981;font-size:10px;letter-spacing:.17em}
    .footer b{color:var(--red)}
    @media(min-width:600px){body{padding-top:42px}}
  </style>
</head>
<body>
<main>
  <div class="logo-wrap"><img src="assets/royrider-logo.png" alt="ROY RIDER motorcycle adventure logo"></div>
  <div class="eyebrow">MOTORCYCLE ADVENTURE</div>
  <h1>ROY RIDER</h1>
  <p class="tagline">LIFE ON TWO WHEELS</p>
  <div class="rule"></div>
  <nav class="links" aria-label="Follow ROY RIDER">
    <a class="link" href="https://www.facebook.com/RoyRider36" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M13.5 21v-8h2.7l.4-3.1h-3.1v-2c0-.9.3-1.5 1.6-1.5h1.7V3.6c-.3 0-1.3-.1-2.5-.1-2.5 0-4.2 1.5-4.2 4.3v2.1H7.3V13h2.8v8h3.4z"/></svg></span>
      <span class="link-text"><strong>Facebook</strong><span>@RoyRider36</span></span><span class="arrow">↗</span>
    </a>
    <a class="link" href="https://www.instagram.com/RoyRider36/" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M7.5 2h9A5.5 5.5 0 0 1 22 7.5v9a5.5 5.5 0 0 1-5.5 5.5h-9A5.5 5.5 0 0 1 2 16.5v-9A5.5 5.5 0 0 1 7.5 2zm0 2A3.5 3.5 0 0 0 4 7.5v9A3.5 3.5 0 0 0 7.5 20h9a3.5 3.5 0 0 0 3.5-3.5v-9A3.5 3.5 0 0 0 16.5 4h-9zM12 7a5 5 0 1 1 0 10 5 5 0 0 1 0-10zm0 2a3 3 0 1 0 0 6 3 3 0 0 0 0-6zm5.3-3.5a1.2 1.2 0 1 1 0 2.4 1.2 1.2 0 0 1 0-2.4z"/></svg></span>
      <span class="link-text"><strong>Instagram</strong><span>@RoyRider36</span></span><span class="arrow">↗</span>
    </a>
    <a class="link" href="https://www.youtube.com/@RoyRider36" target="_blank" rel="noopener noreferrer">
      <span class="icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M23.5 6.2a3 3 0 0 0-2.1-2.1C19.5 3.6 12 3.6 12 3.6s-7.5 0-9.4.5A3 3 0 0 0 .5 6.2 31 31 0 0 0 0 12a31 31 0 0 0 .5 5.8 3 3 0 0 0 2.1 2.1c1.9.5 9.4.5 9.4.5s7.5 0 9.4-.5a3 3 0 0 0 2.1-2.1A31 31 0 0 0 24 12a31 31 0 0 0-.5-5.8zM9.6 15.6V8.4l6.3 3.6-6.3 3.6z"/></svg></span>
      <span class="link-text"><strong>YouTube</strong><span>@RoyRider36</span></span><span class="arrow">↗</span>
    </a>
  </nav>
  <p class="footer">ONE RIDER <b>•</b> ONE BRAND <b>•</b> ALL PLATFORMS</p>
</main>
</body>
</html>
